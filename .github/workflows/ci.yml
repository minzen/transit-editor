name: CI
 
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
 
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
 
jobs:
  lint-test-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
 
      - name: Install dependencies
        run: npm ci
 
      - name: Lint
        run: npm run lint
 
      - name: Unit tests
        run: npm run test
 
      - name: Build
        run: npm run build
 
  e2e:
    name: E2E & Visual Regression
    runs-on: ubuntu-latest
    needs: lint-test-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
 
      - name: Install dependencies
        run: npm ci
 
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
 
      - name: Run E2E tests
        run: npm run e2e
 
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
 
      - name: Upload snapshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs
          path: e2e/**/*.png
          retention-days: 7
          if-no-files-found: ignore
 
  status:
    name: Status Check
    runs-on: ubuntu-latest
    needs: [lint-test-build, e2e]
    if: always()
    permissions:
      statuses: write
    steps:
      - name: Report status
        uses: actions/github-script@v7
        with:
          script: |
            const success =
              '${{ needs.lint-test-build.result }}' === 'success' &&
              '${{ needs.e2e.result }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'ci/all',
              description: success ? 'All checks passed' : 'CI failed',
            });
 
      - name: Summary
        if: always()
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Lint, Test & Build: ${{ needs.lint-test-build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- E2E & Visual Regression: ${{ needs.e2e.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Overall: ${{ needs.lint-test-build.result == 'success' && needs.e2e.result == 'success' && 'success' || 'failure' }}" >> $GITHUB_STEP_SUMMARY
 
      - name: Fail if any job failed
        if: needs.lint-test-build.result != 'success' || needs.e2e.result != 'success'
        run: |
          echo "CI failed. Merge is blocked."
          exit 1
 
  report-pr-comment:
    name: PR Comment
    runs-on: ubuntu-latest
    needs: [lint-test-build, e2e]
    if: github.event_name == 'pull_request' && always()
    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const lintTestBuild = '${{ needs.lint-test-build.result }}';
            const e2e = '${{ needs.e2e.result }}';
            const overall = lintTestBuild === 'success' && e2e === 'success' ? 'success' : 'failure';
 
            const body = `## CI Results\n\n| Job | Status |\n| --- | --- |\n| Lint, Test & Build | ${lintTestBuild === 'success' ? 'passed' : 'failed'} |\n| E2E & Visual Regression | ${e2e === 'success' ? 'passed' : 'failed'} |\n| **Overall** | **${overall === 'success' ? 'passed' : 'failed'}** |`;
 
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
 
            const botComment = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.includes('CI Results'));
 
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
 
      - name: Fail if any job failed
        if: needs.lint-test-build.result != 'success' || needs.e2e.result != 'success'
        run: |
          echo "CI failed. Merge is blocked."
          exit 1
 
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [lint-test-build, e2e]
    if: github.event_name == 'pull_request' && needs.lint-test-build.result == 'success' && needs.e2e.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
 
      - name: Install dependencies
        run: npm ci
 
      - name: Build
        run: npm run build
 
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-preview
          path: dist/
          retention-days: 1
 
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const body = '✅ Build artifact ready for download.';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body === body);
            if (!existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
 
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [lint-test-build, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H ghast.feetunyrhinen.de >> ~/.ssh/known_hosts

      - name: Copy source to VPS
        run: |
          tar --exclude='node_modules' \
              --exclude='.git' \
              --exclude='dist' \
              --exclude='.env' \
              --exclude='test-results' \
              --exclude='playwright-report' \
              -czf - . | ssh deploy@ghast.feetunyrhinen.de "mkdir -p /opt/transit-editor && cd /opt/transit-editor && tar -xzf -"

      - name: Build and restart on VPS
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "${{ github.sha }}")
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          ssh deploy@ghast.feetunyrhinen.de "cd /opt/transit-editor && docker compose down || true"
          ssh deploy@ghast.feetunyrhinen.de "cd /opt/transit-editor && VERSION=$VERSION BUILD_DATE=$BUILD_DATE docker compose build"
          ssh deploy@ghast.feetunyrhinen.de "cd /opt/transit-editor && VERSION=$VERSION docker compose up -d"
 
      - name: Notify deployment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'deploy/production',
              description: 'Deployed to ghast.feetunyrhinen.de',
              target_url: 'https://ghast.feetunyrhinen.de',
            });
 
      - name: Create release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `v${new Date().toISOString().replace(/[-:T]/g, '').slice(0, 12)}`;
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Release ${tag}`,
              body: 'Automated release from CI pipeline',
              draft: false,
              prerelease: false,
            });
 
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [lint-test-build, e2e, deploy-preview, deploy-production]
    if: always()
    permissions:
      statuses: write
    steps:
      - name: Notify success
        if: needs.lint-test-build.result == 'success' && needs.e2e.result == 'success'
        run: echo "All checks passed!"
 
      - name: Notify failure
        if: needs.lint-test-build.result == 'failure' || needs.e2e.result == 'failure'
        run: echo "Some checks failed!"
 
      - name: Block merge on failure
        if: needs.lint-test-build.result == 'failure' || needs.e2e.result == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'ci/merge',
              description: 'Merge blocked: CI failed',
            });
 
      - name: Allow merge on success
        if: needs.lint-test-build.result == 'success' && needs.e2e.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'ci/merge',
              description: 'All checks passed',
            });
 
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
 
      - name: Clean up
        if: always()
        run: rm -rf playwright-report/ test-results/
 
      - name: Summary
        if: always()
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Lint, Test & Build: ${{ needs.lint-test-build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- E2E & Visual Regression: ${{ needs.e2e.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Deploy Preview: ${{ needs.deploy-preview.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Deploy Production: ${{ needs.deploy-production.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Overall: ${{ needs.lint-test-build.result == 'success' && needs.e2e.result == 'success' && 'success' || 'failure' }}" >> $GITHUB_STEP_SUMMARY
