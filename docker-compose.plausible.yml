version: '3.8'

services:
  plausible:
    image: plausible/analytics:latest
    container_name: plausible
    restart: unless-stopped
    depends_on:
      - plausible-db
      - plausible-events
    ports:
      - "8002:8000"
    env_file:
      - plausible-conf.env
    environment:
      - DATABASE_URL=postgres://plausible:plausible@plausible-db:5432/plausible
      - CLICKHOUSE_DATABASE_URL=http://plausible-events:8123/plausible
    volumes:
      - plausible-data:/var/lib/plausible
    networks:
      - plausible-network

  plausible-db:
    image: postgres:15-alpine
    container_name: plausible-db
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=plausible
      - POSTGRES_USER=plausible
      - POSTGRES_DB=plausible
    volumes:
      - plausible-db-data:/var/lib/postgresql/data
    networks:
      - plausible-network

  plausible-events:
    image: clickhouse/clickhouse-server:latest
    container_name: plausible-events
    restart: unless-stopped
    environment:
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=0
    volumes:
      - plausible-events-data:/var/lib/clickhouse
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.d/logging.xml:ro
    networks:
      - plausible-network

volumes:
  plausible-data:
  plausible-db-data:
  plausible-events-data:

networks:
  plausible-network:
