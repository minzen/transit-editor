version: '3.8'

services:
  plausible:
    image: plausible/analytics:latest
    container_name: plausible
    restart: unless-stopped
    depends_on:
      plausible-db:
        condition: service_healthy
      plausible-events:
        condition: service_started
    ports:
      - "8002:8000"
    env_file:
      - plausible-conf.env
    environment:
      - DATABASE_URL=postgres://plausible:plausible@plausible-db:5432/plausible
      - CLICKHOUSE_DATABASE_URL=http://default:plausible@plausible-events:8123/plausible
    volumes:
      - plausible-data:/var/lib/plausible
    networks:
      - plausible-network
    command: >
      sh -c "sleep 10 && /entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"

  plausible-db:
    image: postgres:15-alpine
    container_name: plausible-db
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=plausible
      - POSTGRES_USER=plausible
      - POSTGRES_DB=plausible
    volumes:
      - plausible-db-data:/var/lib/postgresql/data
    networks:
      - plausible-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plausible -d plausible"]
      interval: 5s
      timeout: 5s
      retries: 10

  plausible-events:
    image: clickhouse/clickhouse-server:latest
    container_name: plausible-events
    restart: unless-stopped
    volumes:
      - plausible-events-db:/var/lib/clickhouse
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.d/logging.xml:ro
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/default.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - plausible-network

volumes:
  plausible-data:
  plausible-db-data:
  plausible-events-db:

networks:
  plausible-network:
