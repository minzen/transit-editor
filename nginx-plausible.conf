# Nginx configuration for Plausible Analytics
# Place this file on the Plausible server at /etc/nginx/sites-available/tracking.transit-map-editor.online
# Then symlink it: ln -s /etc/nginx/sites-available/tracking.transit-map-editor.online /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name tracking.transit-map-editor.online;

    # Required headers for Plausible to work correctly
    location / {
        proxy_pass http://localhost:8002;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Prevent nginx from buffering SSE (Server-Sent Events) responses
        proxy_buffering off;
    }
}
